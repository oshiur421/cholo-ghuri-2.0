name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'cholo-ghuri-apk-project.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Unzip Capacitor project
        run: unzip -q cholo-ghuri-apk-project.zip

      - name: Install dependencies and sync
        run: cd cholo-ghuri-apk && npm ci && npx cap sync android

      - name: Build debug APK
        run: cd cholo-ghuri-apk/android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: cholo-ghuri-debug-apk
          path: cholo-ghuri-apk/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Commit APK to repo
        run: |
          cp cholo-ghuri-apk/android/app/build/outputs/apk/debug/app-debug.apk cholo-ghuri.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cholo-ghuri.apk
          git diff --cached --quiet && echo "APK unchanged" || git commit -m "Update cholo-ghuri.apk [skip ci]"
          git push
